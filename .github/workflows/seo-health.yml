name: Daily SEO health check

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST every day
  workflow_dispatch: {}

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/seo-check.mjs
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
